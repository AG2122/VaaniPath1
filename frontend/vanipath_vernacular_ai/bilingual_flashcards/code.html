<script src="../shared/api.js"></script>
<script>
// Back button
(function() {
  var arrowBacks = document.querySelectorAll('.material-symbols-outlined');
  arrowBacks.forEach(function(el) {
    if (el.textContent.trim() === 'arrow_back') {
      el.parentElement.style.cursor = 'pointer';
      el.parentElement.addEventListener('click', function() {
        window.location.href = '../teacher_dashboard/code.html';
      });
    }
  });
  // Desktop 'Back to Categories' button
  var backToCatBtn = null;
  document.querySelectorAll('button').forEach(function(b) {
    if (b.textContent.includes('Back to Categories')) backToCatBtn = b;
  });
  if (backToCatBtn) {
    backToCatBtn.style.cursor = 'pointer';
    backToCatBtn.addEventListener('click', function() {
      window.location.href = '../teacher_dashboard/code.html';
    });
  }
})();

(async function() {
  let cards = [];
  let currentIndex = 0;
  let flagged = {};
  const hindiEl = document.getElementById('card-hindi');
  const santhaliEl = document.getElementById('card-santhali');
  const progressText = document.getElementById('progress-text');
  const progressBar = document.getElementById('progress-bar');
  // Find buttons by their text content since :has(.icon_name) doesn't match icon text
  var prevBtn = null, nextBtn = null, speakerBtn = null;
  document.querySelectorAll('button').forEach(function(b) {
    var txt = b.textContent.trim();
    if (txt.includes('Previous')) prevBtn = b;
    else if (txt.includes('Next') && !txt.includes('Previous')) nextBtn = b;
    else if (txt.includes('volume_up') && !txt.includes('Previous') && !txt.includes('Next')) speakerBtn = b;
  });
  const flagBtn = document.querySelector('button[aria-label="Mark as difficult"]');
  let currentAudio = null;
  let audioMode = localStorage.getItem('vanipath_audio_mode') || (navigator.onLine ? 'online' : 'offline');

  function showCard() {
    if (cards.length === 0) return;
    const card = cards[currentIndex];
    hindiEl.textContent = card.hindi;
    santhaliEl.textContent = card.santhali + (card.pronunciation ? ' (' + card.pronunciation + ')' : '');
    progressText.textContent = (currentIndex + 1) + ' / ' + cards.length;
    progressBar.style.width = ((currentIndex + 1) / cards.length * 100) + '%';
    // Update flag state
    if (flagBtn) {
      if (flagged[currentIndex]) {
        flagBtn.classList.add('text-error', 'bg-error-container');
        flagBtn.classList.remove('text-outline', 'hover:text-error', 'hover:bg-error-container');
      } else {
        flagBtn.classList.remove('text-error', 'bg-error-container');
        flagBtn.classList.add('text-outline', 'hover:text-error', 'hover:bg-error-container');
      }
    }
  }

  async function playAudio() {
    if (cards.length === 0) return;
    const card = cards[currentIndex];
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    try {
      const formData = new FormData();
      formData.append('text', card.santhali);
      formData.append('language', 'sat');
      formData.append('mode', audioMode);
      const res = await fetch('/api/speech/tts', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success && data.data && data.data.audio_url) {
        currentAudio = new Audio(data.data.audio_url);
        currentAudio.volume = 1;
        currentAudio.play().catch(function(err) { console.error('Audio play error:', err); });
      } else if (data.data && data.data.audio_unavailable) {
        console.warn('Audio unavailable offline for:', card.santhali);
      }
    } catch(e) { console.error('TTS error:', e); }
  }

  try {
    const res = await apiGenerateFlashcards('Animals', 12, 1);
    if (res.success) {
      cards = res.data.flashcards;
      showCard();
    }
  } catch(e) {
    hindiEl.textContent = 'Backend offline';
  }

  if (prevBtn) prevBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (currentIndex > 0) { currentIndex--; showCard(); }
  });
  if (nextBtn) nextBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (currentIndex < cards.length - 1) { currentIndex++; showCard(); }
  });
  if (speakerBtn) speakerBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    playAudio();
  });
  if (flagBtn) flagBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    flagged[currentIndex] = !flagged[currentIndex];
    showCard();
  });
})();
</script>
