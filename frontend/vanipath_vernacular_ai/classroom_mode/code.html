<script>
(async function() {
  const grid = document.getElementById('phrases-grid');
  let audioMode = localStorage.getItem('vanipath_audio_mode') || (navigator.onLine ? 'online' : 'offline');
  let currentAudio = null;

  async function playSanthaliAudio(text) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    try {
      const formData = new FormData();
      formData.append('text', text);
      formData.append('language', 'sat');
      formData.append('mode', audioMode);
      const res = await fetch('/api/speech/tts', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success && data.data && data.data.audio_url) {
        currentAudio = new Audio(data.data.audio_url);
        currentAudio.volume = 1;
        currentAudio.play().catch(function(err) { console.error('Audio play error:', err); });
      } else if (data.data && data.data.audio_unavailable) {
        console.warn('Audio unavailable offline for:', text);
      }
    } catch(e) { console.error('TTS error:', e); }
  }

  try {
    const res = await apiGetClassroomPhrases();
    if (res.success && res.data.phrases.length > 0) {
      grid.innerHTML = '';
      res.data.phrases.forEach(p => {
        const card = document.createElement('div');
        card.className = 'bg-surface rounded-[24px] p-md border border-outline-variant shadow-sm hover:shadow-[0_8px_16px_rgba(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 flex flex-col text-left group';
        card.innerHTML = `
          <div class="flex justify-between items-start mb-sm w-full">
            <span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">${p.english || ''}</span>
            <button class="speak-btn w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0 cursor-pointer hover:bg-primary hover:text-on-primary transition-colors" data-santhali="${p.santhali.replace(/"/g, '&quot;')}" aria-label="Play Santhali audio">
              <span class="material-symbols-outlined icon-filled">volume_up</span>
            </button>
          </div>
          <div class="bg-surface-container-low rounded-lg p-sm w-full border border-surface-dim">
            <p class="font-headline-md text-headline-md font-bold text-on-surface mb-base">${p.hindi}</p>
            <p class="font-body-md text-body-md text-on-surface-variant">(Hindi)</p>
          </div>
          <div class="mt-xs bg-surface-container rounded-lg p-sm w-full">
            <p class="font-headline-md text-headline-md font-bold text-tertiary-container mb-base">${p.santhali}</p>
            <p class="font-body-md text-body-md text-on-surface-variant">(Santhali)</p>
          </div>
        `;
        grid.appendChild(card);
      });

      grid.addEventListener('click', function(e) {
        var speakBtn = e.target.closest('.speak-btn');
        if (speakBtn) {
          e.stopPropagation();
          var satText = speakBtn.getAttribute('data-santhali');
          playSanthaliAudio(satText);
          return;
        }
      });
    }
  } catch(e) {
    grid.innerHTML = '<p class="text-error col-span-full text-center py-8">Could not load phrases. Backend offline.</p>';
  }
})();
</script>
