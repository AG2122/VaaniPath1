<style>
        /* Pulse Animation for Mic */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { transform: scale(1.5); opacity: 0; }
        }
        .mic-pulse::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: theme('colors.secondary-container');
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        /* Skeleton shimmer for translating state */
        @keyframes shimmer {
            0% { background-position: -200% 0; }

        .animate-shimmer {
            background: linear-gradient(90deg, theme('colors.surface-container-high') 25%, theme('colors.surface-variant') 50%, theme('colors.surface-container-high') 75%);

<script>
(function() {
  var micBtn = document.querySelector('.mic-pulse button');
  var sourceText = document.getElementById('source-text');
  var translatedText = document.getElementById('translated-text');
  var englishText = document.getElementById('english-text');
  var statusEl = document.getElementById('translate-status');
  var timeEl = document.getElementById('translate-time');
  var confidenceEl = document.getElementById('translate-confidence');

  // --- Online/Offline Mode Toggle ---
  var modeIcon = document.getElementById('mode-icon');
  var modeLabel = document.getElementById('mode-label');
  var modeToggle = document.getElementById('mode-toggle');
  var modeThumb = document.getElementById('mode-thumb');
  var modeStatus = document.getElementById('mode-status');
  var _audioMode = localStorage.getItem('vanipath_audio_mode');
  if (!_audioMode) {
    _audioMode = (navigator.onLine !== false) ? 'online' : 'offline';
  }

  function _applyMode(m) {
    _audioMode = m;
    localStorage.setItem('vanipath_audio_mode', m);
    if (m === 'online') {
      modeIcon.textContent = 'cloud_done';
      modeIcon.className = 'material-symbols-outlined text-[16px] text-primary';
      modeLabel.textContent = 'Online';
      modeLabel.className = 'font-caption text-caption text-primary font-medium';
      modeToggle.style.backgroundColor = '#004ac6';
      modeThumb.style.transform = 'translateX(20px)';
      modeStatus.textContent = 'AI • Live TTS';
    } else {
      modeIcon.textContent = 'cloud_off';
      modeIcon.className = 'material-symbols-outlined text-[16px] text-tertiary';
      modeLabel.textContent = 'Offline';
      modeLabel.className = 'font-caption text-caption text-on-surface-variant';
      modeToggle.style.backgroundColor = '#737686';
      modeThumb.style.transform = 'translateX(0)';
      modeStatus.textContent = 'AI • Language Pack';
    }
  }

  if (modeToggle) {
    modeToggle.addEventListener('click', function() {
      _applyMode(_audioMode === 'online' ? 'offline' : 'online');
    });
  }

  // Auto-detect on network change
  window.addEventListener('online', function() {
    if (!localStorage.getItem('vanipath_audio_mode')) _applyMode('online');
  });
  window.addEventListener('offline', function() {
    if (!localStorage.getItem('vanipath_audio_mode')) _applyMode('offline');
  });

  _applyMode(_audioMode);

  var _voicesReady = false;
  function _loadVoices() {
    if (_voicesReady) return;
    var v = window.speechSynthesis.getVoices();
    if (v.length > 0) _voicesReady = true;
  }
  if ('speechSynthesis' in window) {
    _loadVoices();
    window.speechSynthesis.onvoiceschanged = function() { _voicesReady = true; };
  }
  function _pickVoice(lang) {
    var voices = window.speechSynthesis.getVoices();
    if (!voices.length) return null;
    var exact = voices.find(function(v) { return v.lang === lang; });
    if (exact) return exact;
    var prefix = lang.split('-')[0];
    var partial = voices.find(function(v) { return v.lang.startsWith(prefix); });
    if (partial) return partial;
    var fallback = voices.find(function(v) { return v.lang.startsWith('en-IN'); });
    if (fallback) return fallback;
    return voices[0];
  }
  var _speaking = false;
  var _speakingBtn = null;
  var _currentAudio = null;

  function speak(text, lang, btn) {
    // Toggle: if already playing, stop
    if (_speaking) {
      if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
      window.speechSynthesis.cancel();
      _speaking = false;
      _speakingBtn = null;
      if (btn) btn.classList.remove('animate-pulse');
      return;
    }

    _speaking = true;
    _speakingBtn = btn || null;
    if (btn) {
      btn.classList.remove('animate-pulse');
      btn.classList.add('animate-pulse');
    }

    // For Santhali: use backend TTS (online or offline based on mode)
    if (lang === 'sat') {
      var formData = new FormData();
      formData.append('text', text);
      formData.append('language', 'sat');
      formData.append('mode', _audioMode || 'offline');
      fetch(API_BASE + '/speech/tts', { method: 'POST', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.data && data.data.audio_url) {
            var audio = new Audio(data.data.audio_url);
            _currentAudio = audio;
            audio.onended = function() { _speaking = false; _speakingBtn = null; _currentAudio = null; if (btn) btn.classList.remove('animate-pulse'); };
            audio.onerror = function() { _speaking = false; _speakingBtn = null; _currentAudio = null; if (btn) btn.classList.remove('animate-pulse'); };
            audio.play().catch(function() { _speaking = false; _speakingBtn = null; _currentAudio = null; if (btn) btn.classList.remove('animate-pulse'); });
          } else if (data.data && data.data.audio_unavailable) {
            _speaking = false; _speakingBtn = null; if (btn) btn.classList.remove('animate-pulse');
            var msg = _audioMode === 'online' ? 'Online audio unavailable — no offline audio for this sentence.' : 'Audio unavailable offline';
            statusEl.textContent = msg;
            setTimeout(function() { statusEl.textContent = 'Translated'; }, 4000);
          } else {
            _speaking = false; _speakingBtn = null; if (btn) btn.classList.remove('animate-pulse');
          }
        })
        .catch(function() { _speaking = false; _speakingBtn = null; if (btn) btn.classList.remove('animate-pulse'); });
      return;
    }

    // For Hindi: use browser speechSynthesis
    if (!('speechSynthesis' in window)) { _speaking = false; _speakingBtn = null; return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.85;
    var voice = _pickVoice(lang);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.onend = function() { _speaking = false; _speakingBtn = null; if (btn) btn.classList.remove('animate-pulse'); };
    u.onerror = function() { _speaking = false; _speakingBtn = null; if (btn) btn.classList.remove('animate-pulse'); };
    window.speechSynthesis.cancel();
    setTimeout(function() { window.speechSynthesis.speak(u); }, 50);
    setTimeout(function() { _speaking = false; _speakingBtn = null; if (btn) btn.classList.remove('animate-pulse'); }, 5000);
  }

  var volBtns = document.querySelectorAll('button');
  volBtns.forEach(function(btn) {
    var icon = btn.querySelector('.material-symbols-outlined');
    if (icon && icon.textContent.trim() === 'volume_up') {
      btn.style.cursor = 'pointer';
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var isTarget = btn.closest('.bg-primary-container');
        if (isTarget) {
          var txt = translatedText.textContent.replace(/^\"|\"$/g, '');
          speak(txt, 'sat', btn);
        } else {
          var txt2 = sourceText.textContent.replace(/^\"|\"$/g, '');
          speak(txt2, 'hi-IN', btn);
        }
      });
    }
  });

  async function doTranslate(text) {
    statusEl.textContent = 'Translating...';
    var start = performance.now();
    try {
      var res = await apiTranslate(text, 'hi', 'sat', { grade: 2, subject: 'mathematics' });
      var elapsed = ((performance.now() - start) / 1000).toFixed(1);
      if (res.success) {
        translatedText.textContent = '\"' + res.data.translated_text + '\"';
        englishText.textContent = text;
        statusEl.textContent = 'Translated';
        timeEl.textContent = elapsed + 's';
        confidenceEl.innerHTML = '<span class="material-symbols-outlined text-[14px]">check_circle</span> ' + Math.round(res.data.confidence * 100) + '% Confidence';
      }
    } catch(e) {
      statusEl.textContent = 'Error - Backend offline';
      console.error(e);
    }
  }

  if (micBtn) {
    micBtn.addEventListener('click', function() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        var recognition = new SR();
        recognition.lang = 'hi-IN';
        recognition.interimResults = false;
        recognition.onresult = function(ev) {
          var text = ev.results[0][0].transcript;
          sourceText.textContent = '\"' + text + '\"';
          doTranslate(text);
        };
        recognition.onerror = function() { doTranslate('\u092c\u091a\u094d\u091a\u094b\u0902, \u0906\u091c \u0939\u092e \u0938\u0902\u0916\u094d\u092f\u093e\u0913\u0902 \u0915\u0947 \u092c\u093e\u0930\u0947 \u092e\u0947\u0902 \u0938\u0940\u0916\u0947\u0902\u0917\u0947\u0902\u0964'); };
        recognition.start();
      } else {
