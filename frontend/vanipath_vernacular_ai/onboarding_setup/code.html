<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Top nav is suppressed as per instructions for Onboarding linear screen -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-[24px] p-md custom-shadow-2 flex flex-col gap-[32px] md:gap-[40px] border border-outline-variant/30">
<!-- Header -->
<header class="flex flex-col items-center gap-sm text-center">
<img alt="VaniPath Logo" class="w-[80px] h-[80px] object-cover rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4sDQzYKUquOKoWWrAoJlPFozxS3V3_KTSCKr1rnvBF8Pc3_fsKQG7y2mdXbDBt7bfDK_IDdBbIPVCM1tmusO6DcKHlRctI91S_WDbUzO7Wn4otPmF8UxEYdWuT55PcDHxJJezSdF9HwOtE58G_hIX9mVrTF5WZOciIwNXT_fQuARVIT03t-dY098gzx6kskF_OyT_F8yBIxI9eh1XF9_kJl6kly3931WYA8KXVOOgo__9mJbrAh9tfA"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">
                Learn in the language you understand
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">Set up your personalized learning path.</p>
</header>
<!-- Role Selection -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">I am a...</h2>
<div class="grid grid-cols-3 gap-xs">
<!-- Teacher -->
<button class="flex flex-col items-center justify-center p-sm rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors group focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
<span class="material-symbols-outlined text-[32px] text-primary mb-2 group-hover:scale-110 transition-transform">school</span>
<span class="font-label-md text-label-md text-on-surface">Teacher</span>
</button>
<!-- Student -->
<button class="flex flex-col items-center justify-center p-sm rounded-xl border-2 border-primary bg-primary-fixed/20 group focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent custom-shadow-1">
<span class="material-symbols-outlined text-[32px] text-primary mb-2" style="font-variation-settings: 'FILL' 1;">face</span>
<span class="font-label-md text-label-md text-primary font-semibold">Student</span>
</button>
<!-- Validator -->
<button class="flex flex-col items-center justify-center p-sm rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors group focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
<span class="material-symbols-outlined text-[32px] text-primary mb-2 group-hover:scale-110 transition-transform">verified</span>
<span class="font-label-md text-label-md text-on-surface">Validator</span>
</button>
</div>
</section>
<!-- Login / Mobile -->
<section class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="mobile-number">Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">phone_iphone</span>
<input class="w-full h-[48px] pl-10 pr-4 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline/70" id="mobile-number" placeholder="+91 00000 00000" type="tel"/>
</div>
</section>
<!-- Language Setup -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Language Settings</h2>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="teaching-lang">Teaching Language</label>
<div class="relative">
<select class="w-full h-[48px] pl-4 pr-10 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface appearance-none focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none" id="teaching-lang">
<option value="hindi">Hindi</option>
<option value="english">English</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="classroom-lang">Classroom Language</label>
<div class="relative">
<select class="w-full h-[48px] pl-4 pr-10 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface appearance-none focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none" id="classroom-lang">
<option value="sat" selected>Santhali</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">arrow_drop_down</span>
</div>
</div>
</section>
<!-- Offline Setup & Download -->
<section class="flex flex-col gap-md p-md rounded-xl bg-surface-container-low border border-outline-variant/50">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-semibold flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary">cloud_off</span>
                        Offline Setup
                    </span>
<span class="font-caption text-caption text-on-surface-variant mt-1">Enable learning without internet</span>
</div>
<!-- Toggle -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div class="flex flex-col gap-xs">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors custom-shadow-1">
<span class="material-symbols-outlined">download</span>
                    Download Language Pack
                </button>
<div class="flex flex-col gap-1 mt-2">
<div class="flex justify-between font-caption text-caption text-on-surface-variant">
<span>Downloading Santhali pack...</span>
<span>65%</span>
</div>
<div class="w-full h-2 bg-surface-dim rounded-full overflow-hidden">
<div class="h-full bg-tertiary rounded-full" style="width: 65%;"></div>
</div>
</div>
</div>
</section>
<!-- Continue Button -->
<button class="w-full h-[48px] bg-primary-container text-on-primary-container rounded-xl font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary hover:text-on-primary transition-colors custom-shadow-1 mt-auto">
            Continue to Dashboard
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</main>
<!-- Navigation shells (TopAppBar, BottomNavBar) omitted intentionally as per guidelines for linear/onboarding screens -->
<script src="../shared/api.js"></script>
<script>
(function() {
  const roleBtns = document.querySelectorAll('.grid.grid-cols-3 button');
  let selectedRole = 'student';
  roleBtns.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      roleBtns.forEach(b => { b.classList.remove('border-2', 'border-primary', 'bg-primary-fixed/20'); b.classList.add('border', 'border-outline-variant'); });
      btn.classList.add('border-2', 'border-primary', 'bg-primary-fixed/20');
      btn.classList.remove('border', 'border-outline-variant');
      selectedRole = ['teacher', 'student', 'validator'][i];
    });
  });

  document.querySelector('button:last-of-type').addEventListener('click', async () => {
    const mobile = document.getElementById('mobile-number').value;
    const email = mobile ? mobile.replace(/[^0-9]/g, '') + '@vanipath.in' : 'teacher@vanipath.in';
    try {
      await apiLogin(email, 'teacher123');
      window.location.href = '../teacher_dashboard/code.html';
    } catch(e) {
      try {
        await apiRegister(selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1), email, 'teacher123', selectedRole);
        window.location.href = '../teacher_dashboard/code.html';
      } catch(e2) {
        alert('Could not connect to backend. Start the server with: uvicorn app.main:app --reload');
      }
    }
  });

  const dlBtn = document.querySelector('button.w-full.h-\\[48px\\].bg-primary');
  if (dlBtn) {
    dlBtn.addEventListener('click', async () => {
      try {
        const pack = await apiGetLanguagePack();
        localStorage.setItem('vanipath_lang_pack', JSON.stringify(pack));
        dlBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Downloaded!';
      } catch(e) {
        alert('Backend not running. Start with: uvicorn app.main:app --reload');
      }
    });
  }
})();
</script>
</body></html>
